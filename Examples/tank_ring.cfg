#######################
# AERIS failure-tree component parameters
#######################
#
# Each tank tagged with a COMPONENT_TYPE above needs a matching
# [Parameters.<marker>] section giving its BASELINE values as plain numbers.
# These are only baselines: uncertainty is declared the same way as the rest of
# TITAN's UQ, in the campaign yaml (see [Uncertainty] Yaml_path), as
# <field>__<marker> parameters bound to distributions -- e.g.
# nominalBurstPressure__Tank_Yellow_0 -> a pbox_normal distribution. The UQMapper
# overwrites the baseline for any such field once per -MC sample, so a plain
# (non -MC) run just uses the baselines below unchanged.
#
# Each sampled value is held fixed while the trajectory is propagated. The limit
# state is checked every iteration at the component's LIVE reentry temperature,
# and the first crossing bursts the tank: it is separated from the ring, which
# changes the mass and ballistic coefficient of both pieces and so alters the
# trajectory from that point on. The failure probability is therefore not
# computed analytically -- it is the fraction of the -MC population that burst.
#
# NOTE - CONTRIVED BURST PRESSURES.  These tanks are interior bodies shielded by
# the EEB ring, so they never take direct aerothermal flux and only reach ~304 K
# over the whole trajectory (the ring itself peaks near 395 K and never demises).
# Realistic burst pressures of ~4.5 MPa therefore give p_fail = 0 for every
# iteration, which exercises nothing.  The baselines below (and the distributions
# in the yaml) are instead calibrated against the aerisboom burst LSF so the
# limit state is crossed inside the 300-304 K band the tanks actually occupy: the
# helium fill generates ~1.58 MPa there, and the critical burst pressure sweeps
# 1.554 MPa (300 K) -> 1.599 MPa (304.4 K).  They are deliberately non-physical -
# a tank marginal at room temperature - and exist purely to drive the failure
# tree through a real probability transition.  Use ~4.5 MPa for a physical case.


# devnote: removed deprecated variables (UTS, liquidvol/mass etc)

# --- FuelTank #1 (titanium, hydrazine): burst pressure is a p-box in the yaml
[Parameters.Tank_Yellow_0]
Volume                          = 0.2
InitialTemperature              = 300
NominalBurstPressure            = 1.575e6
NominalTemperature              = 300
# Strength-table units: A316 @ 300 K -> 630 [MPa] <----- was nominalUTS value
PropMass                        = 100
GasMass                         = 0.25

# --- FuelTank #2 (titanium, hydrazine): precise (normal) burst pressure in yaml
# Contrived (see note above).  This tank carries GasMass 0.3 rather than 0.25, so
# its helium fill sits ~20% higher and the critical burst pressure is 1.865 MPa
# (300 K) -> 1.920 MPa (304.5 K) -- a different window from Tank_Yellow_0's.
[Parameters.Tank_Yellow_3]
Volume                          = 0.2
InitialTemperature              = 300
NominalBurstPressure            = 1.875e6
NominalTemperature              = 300
PropMass                        = 100
GasMass                         = 0.3

# devnote: added propMass to WaterTank as a replacement to liqMass, may need to change again

# --- WaterTank #1 (steel): normal burst pressure in yaml
# Contrived (see note above): water/oxygen fill puts the critical burst pressure
# at 0.2411 MPa (300 K) -> 0.2434 MPa (302 K), so this straddles that window.
[Parameters.Tank_Green_0]
Volume                          = 0.2
InitialTemperature              = 300
NominalBurstPressure            = 2.422e5
NominalTemperature              = 300
PropMass                        = 100
GasMass                         = 0.4

# --- WaterTank #2 (steel): uniform burst pressure in yaml
[Parameters.Tank_Green_2]
Volume                          = 0.2
InitialTemperature              = 300
NominalBurstPressure            = 2.4225e5
NominalTemperature              = 300
PropMass                        = 100
GasMass                         = 0.4

# devnote: added additional variables and changed the order. Volume is now roomVolume

# --- Battery (housed in the large CFRP box): normal capacity in yaml
[Parameters.Tank_Large_Black_0]
RoomVolume                      = 1.0
InitialACR                      = 1.0
VentDistanceFromCeiling         = 0.5
BatteryGeometry                 = 0
BatteryCathodeChemistry         = 0
NominalCapacity                 = 50
InitialTemperature              = 300
NrCells                         = 20

