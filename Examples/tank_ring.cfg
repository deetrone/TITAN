# AERIS failure tree
#######################

[Failure Tree]

# Enable the AERIS failure tree. Each tagged component's parameters (baselines
# above, uncertainty in the yaml) are fixed once per run; the limit state is then
# checked every iteration at the component's live temperature, and the first
# crossing fragments the component off its assembly. Run with -MC <n> to
# propagate a population (see [Uncertainty]).
Enable_Tree = True

# Path to the aerisboom material database (JSON)
Material_db = /home/peter/Desktop/software/TITAN-ewan/material_db.xml
#Material_db= /home/peter/Desktop/software/TITAN-ewan/TITAN/aeris-boom/materials/materials.xml

